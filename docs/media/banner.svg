    <path d="M20 20 V72" stroke="#3b82f6"/>
    <path d="M20 72 V124" stroke="#3b82f6"/>
    <path d="M20 124 V176" stroke="#3b82f6"/>
    <path d="M76 20 V72" stroke="#f97316"/>

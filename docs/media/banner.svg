    <circle cx="76" cy="20" r="8" fill="#f97316" stroke="#08090B" stroke-width="4"/>
    <circle cx="20" cy="72" r="8" fill="#3b82f6" stroke="#08090B" stroke-width="4"/>
    <circle cx="76" cy="72" r="8" fill="#f97316" stroke="#08090B" stroke-width="4"/>
    <circle cx="20" cy="124" r="11" fill="#3b82f6" stroke="#08090B" stroke-width="4"/>
